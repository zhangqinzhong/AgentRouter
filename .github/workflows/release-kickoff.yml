name: Release Kickoff

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-request"
      - ".github/workflows/release-kickoff.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-kickoff
  cancel-in-progress: false

jobs:
  kickoff:
    name: Create tag and start release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate release plan and documents
        id: version
        run: node build/verify-release-version.mjs

      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            existing="$(git rev-parse "$TAG^{commit}")"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to a different commit; refusing to republish"
              exit 1
            fi
            echo "$TAG already exists at the requested commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Start release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
