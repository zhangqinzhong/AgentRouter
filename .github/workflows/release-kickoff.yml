name: Release Kickoff

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-request"
      - ".github/workflows/release-kickoff.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-kickoff
  cancel-in-progress: false

jobs:
  kickoff:
    name: Create tag and start release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate requested version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          requested="$(tr -d '[:space:]' < .github/release-request)"
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release request: $requested"
            exit 1
          fi
          if [[ "$requested" != "$package_version" ]]; then
            echo "Release request $requested does not match package.json $package_version"
            exit 1
          fi
          echo "tag=v$requested" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Start release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
