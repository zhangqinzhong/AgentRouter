name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build/verify-release-version.mjs
      - run: npm run typecheck
      - run: npm run test:collector
      - run: npm run test:core
      - run: npm run test:ui
  native:
    name: Native macOS checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node build/check-native-parity.mjs
      - run: swift test --build-system xcode --package-path native/AgentRouterTray
