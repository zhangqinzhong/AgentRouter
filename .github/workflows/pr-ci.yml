name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build/verify-release-version.mjs
      - run: npm run typecheck
      - run: rustup toolchain install 1.93.0 --profile minimal && rustup default 1.93.0
      - run: cargo test --locked --manifest-path native/session-core/Cargo.toml
      - run: cargo build --release --locked --manifest-path native/session-reader/Cargo.toml
      - run: cargo build --release --locked --manifest-path native/session-core/Cargo.toml --bins
      - run: npm run test:collector
      - run: npm run build:memory
      - run: npm run test:core
      - run: npm run test:ui
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/overview-trend-tooltip.spec.ts tests/e2e/data-sources.spec.ts --project=chromium
      - run: npm run test:architecture
      - run: npm run test:gateway-stream
  native:
    name: Native macOS checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node build/check-native-parity.mjs
      - run: node build/test-native.mjs
