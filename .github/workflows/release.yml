name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.93.0 --profile minimal && rustup default 1.93.0
      - run: npm ci
      - name: Require immutable release tag
        shell: bash
        run: test "$GITHUB_REF_TYPE" = tag
      - run: node build/verify-release-version.mjs
      - name: Validate source
        run: |
          npm run typecheck
          cargo build --release --locked --manifest-path native/session-reader/Cargo.toml
          cargo build --release --locked --manifest-path native/session-core/Cargo.toml --bins
          npm run test:collector
          npm run build:memory
          npm run test:core
          npm run test:ui
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/overview-trend-tooltip.spec.ts tests/e2e/data-sources.spec.ts --project=chromium
          npm run test:architecture
          npm run test:gateway-stream

  macos:
    name: macOS (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            release_label: Apple-Silicon
          - arch: x64
            runner: macos-15-intel
            release_label: Intel
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.93.0 --profile minimal && rustup default 1.93.0
      - run: npm ci
      - run: node build/verify-release-version.mjs
      - name: Validate native source
        run: |
          node build/check-native-parity.mjs
          node build/test-native.mjs
      - name: Build macOS artifacts
        run: |
          npm run build:assets
          npx electron-builder --config build/electron-builder.local.cjs --mac --${{ matrix.arch }} --publish never -c.mac.artifactName='AgentRouter_${version}-mac-${{ matrix.release_label }}-${arch}.${ext}'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release-local/AgentRouter_*-mac-${{ matrix.release_label }}-${{ matrix.arch }}.*
            release-local/latest-mac.yml
          if-no-files-found: error

  windows:
    name: Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.93.0 --profile minimal && rustup default 1.93.0
      - run: npm ci
      - run: node build/verify-release-version.mjs
      - run: npm run build:app:win:local
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release-local/AgentRouter_*.exe
            release-local/AgentRouter_*.exe.blockmap
            release-local/latest.yml
          if-no-files-found: error

  linux:
    name: Linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.93.0 --profile minimal && rustup default 1.93.0
      - run: npm ci
      - run: node build/verify-release-version.mjs
      - run: npm run build:assets
      - run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*/AgentRouter_*.AppImage
            release/*/latest-linux.yml
          if-no-files-found: error

  publish:
    name: Verify all platforms and publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/publish-release.mjs release-artifacts
