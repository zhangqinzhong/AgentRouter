name: CodeQL

# Advanced setup in place of GitHub's default setup, for one reason: the
# results pass through .github/codeql/filter_test_alerts.py before upload, so
# the name-based Rust queries stop re-opening alerts on synthetic test
# fixtures. Languages, triggers and the weekly schedule match what default
# setup ran. The model packs in .github/codeql/extensions still load
# automatically.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none, os: ubuntu-latest }
          - { language: javascript-typescript, build-mode: none, os: ubuntu-latest }
          - { language: python, build-mode: none, os: ubuntu-latest }
          - { language: rust, build-mode: none, os: ubuntu-latest }
          - { language: swift, build-mode: manual, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the macOS companion
        if: matrix.language == 'swift'
        run: swift build --package-path companions/ai-memory-macos
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results
      - name: Test the alert filter
        run: python3 -I -m unittest discover -s .github/codeql
      - name: Drop name-only alerts on test code
        run: python3 -I .github/codeql/filter_test_alerts.py . sarif-results/*.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
