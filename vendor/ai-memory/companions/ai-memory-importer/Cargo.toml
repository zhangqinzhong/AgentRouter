[workspace]

[package]
name = "ai-memory-importer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ai-memory-client = { version = "0.1.0", path = "../ai-memory-client" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# Native roots, matching the workspace: the importer POSTs to the same server
# an operator may front with a private CA (#492).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
# Stable ingest keys for agentmemory records (UUIDv5 of their ids).
uuid = { version = "1", features = ["v5"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
